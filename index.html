<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chunky Matrix</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

#c { position: fixed; transform-origin: center center; }

/* CRT scanlines */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    transparent, transparent 3px,
    rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px
  );
  pointer-events: none; z-index: 20;
}
/* CRT vignette */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
  pointer-events: none; z-index: 21;
}
#gyro-hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  color: rgba(0,180,0,0.5); font: 12px monospace; letter-spacing: 0.1em;
  pointer-events: none; z-index: 30; transition: opacity 1s;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gyro-hint" style="display:none">TAP TO ENABLE GYRO</div>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
// CHUNKY MATRIX  —  C64 assembly algorithm, exaggerated cell size
// Cell width is viewport-relative: ~8 columns on mobile, ~26 on desktop
// ═══════════════════════════════════════════════════════════════════

// C64 palette
const C_HEAD = '#ffffff';
const C_TR1  = '#92f792';
const C_TR2  = '#009900';
const C_DIM  = '#1b3a1b';
const C_BG   = '#000000';

// C64 screen codes $00–$1F (AND #$1F on SID noise; $20=space excluded)
const CHARS = '@ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*=';

const FPS = 20;

// ── Cell sizing — the chungus knob ─────────────────────────────────
// Target column counts: very few on narrow screens so each char is huge.
function chunkSize(viewW) {
  let targetCols;
  if (viewW < 480)       targetCols = 8;   // phone portrait  → giant
  else if (viewW < 900)  targetCols = 13;  // tablet portrait → big
  else                   targetCols = 24;  // desktop         → chunky
  const w = Math.round(viewW / targetCols);
  const h = Math.round(w * 1.28);         // slightly taller than wide
  const f = Math.round(w * 0.82);         // font fills ~82% of cell width
  return { w, h, f };
}

const cvs = document.getElementById('c');
const ctx  = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

let CELL_W, CELL_H, FONT_PX;
let COLS = 0, ROWS = 0;
let columns = [], grid = [];

// ── Gyroscope ──────────────────────────────────────────────────────
let targetAngle = 0, currentAngle = 0;

function attachGyro() {
  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    const g = Math.max(-75, Math.min(75, e.gamma));
    targetAngle = (g / 75) * (Math.PI * 0.55);
  }, { passive: true });
}

const hint = document.getElementById('gyro-hint');
if (typeof DeviceOrientationEvent !== 'undefined') {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    hint.style.display = 'block';
    document.addEventListener('touchstart', function ask() {
      DeviceOrientationEvent.requestPermission()
        .then(s => { if (s === 'granted') attachGyro(); }).catch(() => {});
      hint.style.opacity = '0';
      setTimeout(() => { hint.style.display = 'none'; }, 1000);
      document.removeEventListener('touchstart', ask);
    }, { once: true });
  } else {
    attachGyro();
  }
}

// ── Column factory ─────────────────────────────────────────────────
function makeColumn(x) {
  const sp = (Math.random() * 4 | 0) + 1;
  return { x, row: Math.random() * ROWS | 0, speed: sp, delay: sp,
           len: (Math.random() * 16 | 0) + 6 };
}

// ── Resize ─────────────────────────────────────────────────────────
function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  ({ w: CELL_W, h: CELL_H, f: FONT_PX } = chunkSize(W));

  const D = Math.ceil(Math.sqrt(W * W + H * H)) + CELL_W * 2;
  cvs.width  = D; cvs.height = D;
  cvs.style.width  = D + 'px'; cvs.style.height = D + 'px';
  cvs.style.left   = ((W - D) / 2) + 'px';
  cvs.style.top    = ((H - D) / 2) + 'px';

  COLS = Math.ceil(D / CELL_W);
  ROWS = Math.ceil(D / CELL_H);

  ctx.font         = `900 ${FONT_PX}px "Courier New", monospace`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = C_BG;
  ctx.fillRect(0, 0, D, D);

  grid    = Array.from({ length: COLS }, () => new Array(ROWS).fill(' '));
  columns = Array.from({ length: COLS }, (_, i) => makeColumn(i));
}
window.addEventListener('resize', resize, { passive: true });
resize();

// ── Draw helpers ────────────────────────────────────────────────────
function drawCell(c, r, ch, color, glow) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  const px = c * CELL_W, py = r * CELL_H;
  ctx.shadowBlur = 0;
  ctx.fillStyle  = C_BG;
  ctx.fillRect(px, py, CELL_W, CELL_H);
  if (ch !== ' ') {
    if (glow) { ctx.shadowColor = '#00ff41'; ctx.shadowBlur = CELL_W * 0.45; }
    ctx.fillStyle = color;
    ctx.fillText(ch, px + CELL_W / 2, py + CELL_H - Math.round(CELL_H * 0.12));
    ctx.shadowBlur = 0;
  }
  grid[c][r] = ch;
}

function recolour(c, r, color) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  const ch = grid[c][r];
  if (ch === ' ') return;
  const px = c * CELL_W, py = r * CELL_H;
  ctx.fillStyle = C_BG;
  ctx.fillRect(px, py, CELL_W, CELL_H);
  ctx.fillStyle = color;
  ctx.fillText(ch, px + CELL_W / 2, py + CELL_H - Math.round(CELL_H * 0.12));
}

// ── Update (C64 algorithm) ──────────────────────────────────────────
function update() {
  for (let x = 0; x < COLS; x++) {
    const col = columns[x];
    if (--col.delay > 0) continue;
    col.delay = col.speed;
    col.row++;
    if (col.row - col.len >= ROWS) {
      col.row   = 0;
      col.speed = (Math.random() * 4 | 0) + 1;
      col.delay = col.speed;
      col.len   = (Math.random() * 16 | 0) + 6;
    }
    const r = col.row;
    drawCell(x, r - col.len,     ' ',  C_BG);
    recolour(x,  r - col.len + 1, C_DIM);
    recolour(x,  r - 2,           C_TR2);
    recolour(x,  r - 1,           C_TR1);
    drawCell(x,  r, CHARS[Math.random() * CHARS.length | 0], C_HEAD, true);
  }
}

// ── Render loop ─────────────────────────────────────────────────────
const STEP_MS = 1000 / FPS;
let lastT = 0;

function frame(t) {
  requestAnimationFrame(frame);
  const diff = targetAngle - currentAngle;
  if (Math.abs(diff) > 0.0003) {
    currentAngle += diff * 0.07;
    cvs.style.transform = `rotate(${currentAngle.toFixed(4)}rad)`;
  }
  if (t - lastT < STEP_MS) return;
  lastT = t - ((t - lastT) % STEP_MS);
  update();
}

requestAnimationFrame(frame);
</script>
</body>
</html>
