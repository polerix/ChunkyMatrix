<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chunky Matrix</title>
<!--
  CJK font: Boutique Bitmap 9×9 by 字言字型—FancyType (OFL)
  Download from https://luke036.itch.io/boutique-bitmap-9x9
  Place BoutiqueBitmap9x9.ttf (or .woff2) in this folder and
  uncomment the @font-face block below.
-->
<!--
@font-face {
  font-family: 'BoutiqueBitmap9x9';
  src: url('BoutiqueBitmap9x9.woff2') format('woff2'),
       url('BoutiqueBitmap9x9.ttf')   format('truetype');
}
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; }

/* ── C64 SCREENFRAME — colour 14 Light Blue (#7070DE) ───────────── */
#c64-frame {
  position:fixed; inset:0;
  background: #7070DE;
  display:flex; flex-direction:column; align-items:stretch;
  padding: clamp(12px,2.8vw,36px);
  transition: background 0.06s;   /* border register flicker */
}

/* ── C64 SCREEN AREA — colour 6 Dark Blue (#3535CA) ─────────────── */
#c64-screen-wrapper {
  flex:1; position:relative; overflow:hidden;
  background:#3535CA;
}

/* Matrix rain canvas — fills the screen area exactly */
#matrix-cvs {
  position:absolute; inset:0;
  display:none;   /* hidden until loader fades */
}

/* C64 loader canvas — integer-scaled, centred, on top */
#loader-cvs {
  position:absolute;
  image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
  transition: opacity 1.4s ease-in;
}

/* CRT scanlines + vignette over screen area */
#c64-screen-wrapper::after {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:20;
  background:repeating-linear-gradient(transparent,transparent 3px,rgba(0,0,0,0.13) 3px,rgba(0,0,0,0.13) 4px);
}
#c64-screen-wrapper::before {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:21;
  background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,0.65) 100%);
}

/* ── CONTROL STRIP — in the light-blue frame, below screen ───────── */
#c64-controls {
  flex-shrink:0;
  padding: clamp(4px,.8vw,9px) clamp(8px,1.8vw,18px);
  display:flex; align-items:center; gap:clamp(10px,2.5vw,26px);
  font-family:'Press Start 2P', monospace;
  font-size: clamp(6px,1.1vw,10px);
  color: rgba(210,210,255,0.9);
  user-select:none;
}
#c64-controls label { display:flex; align-items:center; gap:clamp(4px,.7vw,7px); cursor:pointer; }
#c64-controls input[type="checkbox"] {
  appearance:none; -webkit-appearance:none;
  width:clamp(8px,1.2vw,13px); height:clamp(8px,1.2vw,13px);
  border:2px solid rgba(180,180,255,.7);
  background:transparent; cursor:pointer; flex-shrink:0; position:relative;
}
#c64-controls input[type="checkbox"]:checked { background:rgba(180,180,255,.7); }
#c64-controls input[type="checkbox"]:checked::after {
  content:''; position:absolute; inset:2px; background:#3535CA;
  clip-path:polygon(20% 50%,40% 75%,80% 20%,80% 30%,40% 85%,20% 60%);
}
.ctrl-div { color:rgba(160,160,220,.4); }
</style>
</head>
<body>
<div id="c64-frame">
  <div id="c64-screen-wrapper">
    <canvas id="matrix-cvs"></canvas>
    <canvas id="loader-cvs"></canvas>
  </div>
  <div id="c64-controls">
    <label title="Katakana + kanji"><input type="checkbox" id="cb-zh" checked> 日 CJK</label>
    <span class="ctrl-div">|</span>
    <label title="A–Z symbols"><input type="checkbox" id="cb-en" checked> ABC</label>
    <span class="ctrl-div">|</span>
    <label title="Space Invader sprites"><input type="checkbox" id="cb-inv" checked> 👾</label>
  </div>
</div>
<script>
'use strict';
// ════════════════════════════════════════════════════════════════════
// C64 LOADER  (preserved verbatim from c64_loader.html, with two
//              modifications: setBorder → frames the #c64-frame div;
//              after READY+RUN → fades loader and starts Matrix rain)
// ════════════════════════════════════════════════════════════════════
(function () {

  const COLS=40, ROWS=25, CW=8, CH=8;
  const BUF_W=COLS*CW, BUF_H=ROWS*CH;   // 320×200

  const PALETTE = [
    '#000000','#FFFFFF','#883932','#67B6BD',
    '#8B3F96','#55A049','#40318D','#BFCE72',
    '#8B5429','#574200','#B86962','#505050',
    '#787878','#94E089','#7869C4','#9F9F9F'
  ];
  const BG_COLOR=6, BORDER_COLOR=14, TEXT_COLOR=14;

  const NOISE_CHARS='█▓▒░▚▞▟▙▜▛▄▀▌▐■□▲▼◆◇●○♠♣♥♦☺☻@#%&*+=<>/\\|-_~^0123456789';
  const TEXT_CHARS ='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .:*_>-';
  const ALL_CHARS  =Array.from(new Set((NOISE_CHARS+TEXT_CHARS).split(''))).join('');

  // Offscreen 320×200 buffer
  const buf=document.createElement('canvas');
  buf.width=BUF_W; buf.height=BUF_H;
  const bctx=buf.getContext('2d');
  bctx.imageSmoothingEnabled=false;

  // Loader canvas (inside screen-wrapper)
  const loader=document.getElementById('loader-cvs');
  const lctx=loader.getContext('2d');
  lctx.imageSmoothingEnabled=false;

  function resizeLoader() {
    const wr=document.getElementById('c64-screen-wrapper').getBoundingClientRect();
    const scale=Math.max(1,Math.min(Math.floor(wr.width/BUF_W),Math.floor(wr.height/BUF_H)));
    loader.width =BUF_W*scale; loader.height=BUF_H*scale;
    loader.style.width =BUF_W*scale+'px'; loader.style.height=BUF_H*scale+'px';
    loader.style.left  =((wr.width -BUF_W*scale)/2)+'px';
    loader.style.top   =((wr.height-BUF_H*scale)/2)+'px';
    lctx.imageSmoothingEnabled=false;
  }
  window.addEventListener('resize', resizeLoader, {passive:true});
  resizeLoader();

  function buildMask(ch) {
    const S=32;
    const tmp=document.createElement('canvas'); tmp.width=S; tmp.height=S;
    const tctx=tmp.getContext('2d');
    tctx.clearRect(0,0,S,S);
    tctx.fillStyle='#fff';
    tctx.font='bold '+(S*0.9)+'px monospace';
    tctx.textAlign='center'; tctx.textBaseline='middle';
    tctx.fillText(ch,S/2,S/2+1);
    const data=tctx.getImageData(0,0,S,S).data;
    const block=S/CW, mask=new Uint8Array(CW*CH);
    for(let gy=0;gy<CH;gy++) for(let gx=0;gx<CW;gx++){
      let sum=0,count=0;
      for(let by=0;by<block;by++) for(let bx=0;bx<block;bx++){
        const px=gx*block+bx, py=gy*block+by;
        sum+=data[(py*S+px)*4+3]; count++;
      }
      mask[gy*CW+gx]=(sum/count)>90?1:0;
    }
    return mask;
  }

  function hexToRgb(hex){const n=parseInt(hex.slice(1),16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}

  // Pre-render glyph canvases for every char × color
  const glyphCache={};
  for(const ch of ALL_CHARS){
    const mask=buildMask(ch); glyphCache[ch]=[];
    for(let c=0;c<16;c++){
      const gcv=document.createElement('canvas'); gcv.width=CW; gcv.height=CH;
      const gctx=gcv.getContext('2d');
      const img=gctx.createImageData(CW,CH);
      const rgb=hexToRgb(PALETTE[c]);
      for(let i=0;i<mask.length;i++){
        const o=i*4;
        if(mask[i]){img.data[o]=rgb.r;img.data[o+1]=rgb.g;img.data[o+2]=rgb.b;img.data[o+3]=255;}
      }
      gctx.putImageData(img,0,0);
      glyphCache[ch][c]=gcv;
    }
  }

  // Screen/color RAM
  const screenChar =new Array(COLS*ROWS).fill(' ');
  const screenColor=new Array(COLS*ROWS).fill(TEXT_COLOR);

  function paintBg(){ bctx.fillStyle=PALETTE[BG_COLOR]; bctx.fillRect(0,0,BUF_W,BUF_H); }
  function drawCell(idx){
    const cx=(idx%COLS)*CW, cy=Math.floor(idx/COLS)*CH;
    bctx.fillStyle=PALETTE[BG_COLOR]; bctx.fillRect(cx,cy,CW,CH);
    const ch=screenChar[idx];
    if(ch!==' '){ const g=glyphCache[ch]&&glyphCache[ch][screenColor[idx]]; if(g) bctx.drawImage(g,cx,cy); }
  }
  function clearScreen(){
    for(let i=0;i<screenChar.length;i++){screenChar[i]=' ';screenColor[i]=TEXT_COLOR;}
    paintBg();
  }
  function setCell(idx,ch,color){ screenChar[idx]=ch; screenColor[idx]=color; drawCell(idx); }
  function printAt(col,row,str,color){
    for(let i=0;i<str.length;i++){const idx=row*COLS+(col+i); if(idx<screenChar.length)setCell(idx,str[i],color);}
  }
  // ── MODIFICATION 1: border register → #c64-frame background ───────
  const frame=document.getElementById('c64-frame');
  function setBorder(ci){ frame.style.background=PALETTE[ci]; }

  function present(){ lctx.drawImage(buf,0,0,BUF_W,BUF_H,0,0,loader.width,loader.height); }

  // State machine
  let state='searching', stateStart=0, loadDuration=0, sweepPtr=0;
  let lastBorderFlicker=0, cursorOn=true, lastCursorToggle=0;
  let loaderRafId=null, loaderDone=false;

  function randRange(a,b){return a+Math.random()*(b-a);}
  function randInt(a,b){return Math.floor(randRange(a,b+1));}
  function randChar(set){return set[randInt(0,set.length-1)];}

  function startSequence(){
    clearScreen(); setBorder(BORDER_COLOR);
    state='searching'; stateStart=performance.now();
    loadDuration=randRange(4000,10000);
    sweepPtr=0;
    printAt(2,2,'SEARCHING FOR *',TEXT_COLOR);
    present();
  }

  // ── MODIFICATION 2: after READY → type RUN → trigger Matrix ───────
  function loaderFinished(){
    if(loaderDone) return; loaderDone=true;
    // Type RUN then hand off
    setTimeout(()=>{
      clearScreen(); setBorder(BORDER_COLOR);
      printAt(1,1,'READY.',TEXT_COLOR);
      setCell(2*COLS+1,'█',TEXT_COLOR); present();
      setTimeout(()=>{
        printAt(1,3,'RUN',TEXT_COLOR); present();
        setTimeout(()=>{ startMatrix(); }, 700);
      }, 1400);
    }, 400);
  }

  function tick(now){
    loaderRafId=requestAnimationFrame(tick);
    const elapsed=now-stateStart;

    if(state==='searching'){
      if(elapsed>900){
        printAt(2,4,'FOUND CHUNKY_MATRIX',TEXT_COLOR);
        state='found'; stateStart=now;
      }
    } else if(state==='found'){
      if(elapsed>700){
        printAt(2,6,'LOADING',TEXT_COLOR);
        state='loading'; stateStart=now;
      }
    } else if(state==='loading'){
      const writes=randInt(18,45);
      for(let w=0;w<writes;w++){
        let idx=Math.random()<0.75?(sweepPtr=(sweepPtr+1)%screenChar.length,sweepPtr-1):randInt(0,screenChar.length-1);
        setCell(idx,randChar(NOISE_CHARS),randInt(0,15));
      }
      if(now-lastBorderFlicker>60){ setBorder(randInt(0,15)); lastBorderFlicker=now; }
      if(elapsed>loadDuration){
        state='ready'; stateStart=now;
        clearScreen(); setBorder(BORDER_COLOR);
        loaderFinished();
      }
    } else if(state==='ready'){
      if(now-lastCursorToggle>400){
        cursorOn=!cursorOn; lastCursorToggle=now;
        setCell(2*COLS+1,cursorOn?'█':' ',TEXT_COLOR);
      }
    }
    present();
  }

  startSequence();
  loaderRafId=requestAnimationFrame(tick);
})();


// ════════════════════════════════════════════════════════════════════
// CHUNKY MATRIX RAIN — starts after the C64 boot sequence finishes
// ════════════════════════════════════════════════════════════════════
(function(){
  const cvs = document.getElementById('matrix-cvs');
  const ctx  = cvs.getContext('2d');

  // Screen background (C64 colour 6 dark blue)
  const C_BG   = '#3535CA';
  // Matrix trail colours
  const C_HEAD = '#FFFFFF';   // white head
  const C_TR1  = '#94E089';   // C64 colour 13 light green
  const C_TR2  = '#55A049';   // C64 colour 5  green
  const C_DIM  = '#2a5a28';   // dim green — last fade before erase

  // Character sets
  const EN_CHARS = '@ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*=';
  const ZH_CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ' +
                   'マミムメモヤユヨラリルレロワヲン日月火水木金土山川田林森石人' +
                   '口大小上下左右中白黒夜雨風空電雲星龍鬼神道';

  // Space Invader sprite bitmaps (8×8, MSB=left)
  const SPRITES = [
    [0b00100100,0b00011000,0b00111100,0b01101110,0b11111111,0b10111101,0b10000001,0b01100110],
    [0b00011000,0b00111100,0b01111110,0b11011011,0b11111111,0b00100100,0b01011010,0b10100101],
    [0b00111100,0b01111110,0b11111111,0b11011011,0b11111111,0b00100100,0b01011010,0b10100101],
  ];
  const INV_SENTINELS = ['\x01','\x02','\x03'];

  let COLS=0, ROWS=0, CELL_W=0, CELL_H=0, FONT_PX=0;
  let columns=[], grid=[];
  let activeChars='';

  // Checkbox controls
  const cbZh  = document.getElementById('cb-zh');
  const cbEn  = document.getElementById('cb-en');
  const cbInv = document.getElementById('cb-inv');

  function rebuildChars(){
    let s='';
    if(cbEn.checked)  s+=EN_CHARS;
    if(cbZh.checked)  s+=ZH_CHARS;
    activeChars=s||EN_CHARS;
  }

  // "Chungus" cell sizing: ~8 columns on phone, more on desktop
  function chunkSize(){
    const W=window.innerWidth;
    const cols=Math.max(7,Math.floor(W/55));
    const cw=Math.floor(W/cols);
    return {cw, ch:Math.round(cw*1.28)};
  }

  function resize(){
    const wr=document.getElementById('c64-screen-wrapper').getBoundingClientRect();
    const {cw,ch}=chunkSize();
    CELL_W=cw; CELL_H=ch;
    FONT_PX=Math.max(8,Math.floor(cw*0.86));

    cvs.width =Math.round(wr.width);
    cvs.height=Math.round(wr.height);

    COLS=Math.ceil(cvs.width /CELL_W);
    ROWS=Math.ceil(cvs.height/CELL_H);

    ctx.font         =`bold ${FONT_PX}px "Press Start 2P", monospace`;
    ctx.textAlign    ='center';
    ctx.textBaseline ='alphabetic';
    ctx.imageSmoothingEnabled=false;

    ctx.fillStyle=C_BG;
    ctx.fillRect(0,0,cvs.width,cvs.height);

    grid   =Array.from({length:COLS},()=>new Array(ROWS).fill(' '));
    columns=Array.from({length:COLS},(_,i)=>makeColumn(i));
  }

  function makeColumn(x){
    const sp=(Math.random()*4|0)+1;
    return{x, row:Math.random()*ROWS|0, speed:sp, delay:sp, len:(Math.random()*16|0)+6};
  }

  // Draw a Space Invader sprite scaled to fill the cell
  function drawSprite(c,r,color,si){
    if(c<0||c>=COLS||r<0||r>=ROWS) return;
    const bmp=SPRITES[si%SPRITES.length];
    const px=c*CELL_W, py=r*CELL_H;
    ctx.fillStyle=C_BG; ctx.fillRect(px,py,CELL_W,CELL_H);
    const pw=Math.max(1,Math.floor(CELL_W/8));
    const ph=Math.max(1,Math.floor(CELL_H/8));
    const ox=Math.floor((CELL_W-pw*8)/2);
    const oy=Math.floor((CELL_H-ph*8)/2);
    ctx.fillStyle=color;
    for(let row=0;row<8;row++){
      for(let bit=0;bit<8;bit++){
        if(bmp[row]&(0b10000000>>bit)){
          ctx.fillRect(px+ox+bit*pw,py+oy+row*ph,pw,ph);
        }
      }
    }
    grid[c][r]=INV_SENTINELS[si%3];
  }

  function randHeadChar(){
    if(cbInv.checked && Math.random()<(1/6)){
      return INV_SENTINELS[Math.floor(Math.random()*3)];
    }
    return activeChars[Math.random()*activeChars.length|0]||'@';
  }

  function drawCell(c,r,ch,color,glow){
    if(c<0||c>=COLS||r<0||r>=ROWS) return;
    const px=c*CELL_W, py=r*CELL_H;
    ctx.shadowBlur=0;
    ctx.fillStyle=C_BG; ctx.fillRect(px,py,CELL_W,CELL_H);
    if(ch===' '){ grid[c][r]=' '; return; }
    const si=INV_SENTINELS.indexOf(ch);
    if(si>=0){ drawSprite(c,r,color,si); return; }
    if(glow){ ctx.shadowColor='#55ff55'; ctx.shadowBlur=CELL_W*0.55; }
    ctx.fillStyle=color;
    ctx.fillText(ch,px+CELL_W/2,py+CELL_H-Math.floor(CELL_H*0.1));
    ctx.shadowBlur=0;
    grid[c][r]=ch;
  }

  // Colour-only repaint — mirrors C64 colour-RAM-only writes
  function recolour(c,r,color){
    if(c<0||c>=COLS||r<0||r>=ROWS) return;
    const ch=grid[c][r];
    if(ch===' ') return;
    const si=INV_SENTINELS.indexOf(ch);
    if(si>=0){ drawSprite(c,r,color,si); return; }
    const px=c*CELL_W, py=r*CELL_H;
    ctx.fillStyle=C_BG; ctx.fillRect(px,py,CELL_W,CELL_H);
    ctx.fillStyle=color;
    ctx.fillText(ch,px+CELL_W/2,py+CELL_H-Math.floor(CELL_H*0.1));
  }

  const FPS=20, STEP_MS=1000/FPS;
  let lastT=0;

  function updateMatrix(){
    for(let x=0;x<COLS;x++){
      const col=columns[x];
      if(--col.delay>0) continue;
      col.delay=col.speed; col.row++;
      if(col.row-col.len>=ROWS){
        col.row=0; col.speed=(Math.random()*4|0)+1;
        col.delay=col.speed; col.len=(Math.random()*16|0)+6;
      }
      const r=col.row;
      drawCell  (x, r-col.len,     ' ',    C_BG);
      recolour  (x, r-col.len+1,           C_DIM);
      recolour  (x, r-2,                   C_TR2);
      recolour  (x, r-1,                   C_TR1);
      const ch=randHeadChar();
      const si=INV_SENTINELS.indexOf(ch);
      if(si>=0) drawSprite(x,r,C_HEAD,si);
      else      drawCell  (x,r,ch,C_HEAD,true);
    }
  }

  function frame(t){
    requestAnimationFrame(frame);
    if(t-lastT<STEP_MS) return;
    lastT=t-((t-lastT)%STEP_MS);
    updateMatrix();
  }

  // Checkbox changes rebuild the active character pool
  [cbZh,cbEn,cbInv].forEach(cb=>cb.addEventListener('change',rebuildChars));

  // Resize matrix canvas when window resizes (only while visible)
  window.addEventListener('resize',()=>{
    if(cvs.style.display!=='none'){ resize(); }
  },{passive:true});

  // Called by the C64 loader IIFE after READY+RUN completes
  window.startMatrix=function(){
    rebuildChars();
    resize();
    const loader=document.getElementById('loader-cvs');
    loader.style.opacity='0';
    cvs.style.display='block';
    setTimeout(()=>{ loader.style.display='none'; }, 1500);
    lastT=0;
    requestAnimationFrame(frame);
  };

})();
</script>
</body>
</html>
