<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chunky Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'BoutiqueBitmap9x9';
  src: url('BoutiqueBitmap9x9_Bold.ttf') format('truetype');
  font-weight: bold;
  font-display: block;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; }

/* C64 screenframe — colour 14 light blue */
#c64-frame {
  position:fixed; inset:0;
  background:#7869C4;
  display:flex; flex-direction:column; align-items:stretch;
  padding: clamp(12px,2.8vw,36px);
}

/* C64 screen area — colour 6 dark blue */
#c64-screen-wrapper {
  flex:1; position:relative; overflow:hidden;
  background:#40318D;
}

#matrix-cvs {
  position:absolute; inset:0;
}

/* Control strip in the frame */
#c64-controls {
  flex-shrink:0;
  padding: clamp(4px,.8vw,9px) clamp(8px,1.8vw,18px);
  display:flex; align-items:center; gap:clamp(10px,2.5vw,26px);
  font-family:'Press Start 2P', monospace;
  font-size: clamp(6px,1.1vw,10px);
  color: rgba(210,210,255,0.9);
  user-select:none;
}
#c64-controls label { display:flex; align-items:center; gap:clamp(4px,.7vw,7px); cursor:pointer; }
#c64-controls input[type="checkbox"] {
  appearance:none; -webkit-appearance:none;
  width:clamp(8px,1.2vw,13px); height:clamp(8px,1.2vw,13px);
  border:2px solid rgba(180,180,255,.7);
  background:transparent; cursor:pointer; flex-shrink:0; position:relative;
}
#c64-controls input[type="checkbox"]:checked { background:rgba(180,180,255,.7); }
#c64-controls input[type="checkbox"]:checked::after {
  content:''; position:absolute; inset:2px; background:#40318D;
  clip-path:polygon(20% 50%,40% 75%,80% 20%,80% 30%,40% 85%,20% 60%);
}
.ctrl-div { color:rgba(160,160,220,.4); }
</style>
</head>
<body>
<div id="c64-frame">
  <div id="c64-screen-wrapper">
    <canvas id="matrix-cvs"></canvas>
  </div>
  <div id="c64-controls">
    <label title="Katakana + kanji"><input type="checkbox" id="cb-zh" checked> 日 CJK</label>
    <span class="ctrl-div">|</span>
    <label title="A-Z symbols"><input type="checkbox" id="cb-en" checked> ABC</label>
    <span class="ctrl-div">|</span>
    <label title="Space Invaders"><input type="checkbox" id="cb-inv" checked> 👾</label>
    <span class="ctrl-div">|</span>
    <label title="Sound on/off"><input type="checkbox" id="cb-snd" checked> SND</label>
  </div>
</div>
<audio id="snd" src="soundtrack.mp4" loop preload="auto"></audio>
<script>
'use strict';
// ════════════════════════════════════════════════════════════════════
// CHUNKY MATRIX — single canvas, boot sequence + rain in one IIFE
// Boot text uses same chunky font & cell size as the Matrix rain.
// Tap glyph → cycle head colour. Tap empty → cycle bg colour.
// Tap frame border → cycle frame colour. All 16 C64 Pepto colours.
// ════════════════════════════════════════════════════════════════════
(function(){

  // ── Pepto C64 palette (16 colours) ───────────────────────────────
  const PALETTE = [
    '#000000','#FFFFFF','#883932','#67B6BD',
    '#8B3F96','#55A049','#40318D','#BFCE72',
    '#8B5429','#574200','#B86962','#505050',
    '#787878','#94E089','#7869C4','#9F9F9F'
  ];

  // Mutable colour indices — tap cycles through palette
  let bgIdx    = 6;   // C64 colour 6 dark blue
  let frameIdx = 14;  // C64 colour 14 light blue
  let headIdx  = 1;   // white (Matrix head)
  const TR1_IDX = 13; // light green  (trail -1)
  const TR2_IDX =  5; // green        (trail -2)
  const DIM_HEX = '#1d381d'; // dim — no palette entry

  const bg   = () => PALETTE[bgIdx];
  const head = () => PALETTE[headIdx];
  const tr1  = () => PALETTE[TR1_IDX];
  const tr2  = () => PALETTE[TR2_IDX];
  const fCol = () => PALETTE[frameIdx];

  // ── DOM ──────────────────────────────────────────────────────────
  const cvs   = document.getElementById('matrix-cvs');
  const ctx   = cvs.getContext('2d');
  const frame = document.getElementById('c64-frame');
  const snd   = document.getElementById('snd');
  const cbZh  = document.getElementById('cb-zh');
  const cbEn  = document.getElementById('cb-en');
  const cbInv = document.getElementById('cb-inv');
  const cbSnd = document.getElementById('cb-snd');

  // ── Character sets ────────────────────────────────────────────────
  const EN_CHARS    = '@ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*=';
  const ZH_CHARS    = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ' +
                      'マミムメモヤユヨラリルレロワヲン日月火水木金土山川田林森石人' +
                      '口大小上下左右中白黒夜雨風空電雲星龍鬼神道';
  const NOISE_CHARS = '█▓▒░▚▞▟▙▜▛▄▀▌▐■□▲▼◆◇●○♠♣♥♦☺☻@#%&*+=<>/\\|-_~^0123456789';

  // Space Invader bitmaps (8×8, MSB=left)
  const SPRITES = [
    [0b00100100,0b00011000,0b00111100,0b01101110,0b11111111,0b10111101,0b10000001,0b01100110],
    [0b00011000,0b00111100,0b01111110,0b11011011,0b11111111,0b00100100,0b01011010,0b10100101],
    [0b00111100,0b01111110,0b11111111,0b11011011,0b11111111,0b00100100,0b01011010,0b10100101],
  ];
  const INV_SENTINELS = ['\x01','\x02','\x03'];

  // ── Layout ───────────────────────────────────────────────────────
  let COLS=0, ROWS=0, CELL_W=0, CELL_H=0, FONT_PX=0;
  let grid=[], columns=[], activeChars='';

  // ── Boot state ────────────────────────────────────────────────────
  // init → typing → searching → found → loading → ready → rain
  let bootState='init', stateStart=0;
  let typingPos=0, lastTypeTime=0;
  let cursorOn=true, lastCursorToggle=0;
  let loadDuration=0, matrixActive=false;
  let CMD_ROW=6, SEARCH_ROW=9;
  const LOAD_CMD    = 'LOAD "CHUNKY_MATRIX",8,1';
  const TYPE_DELAY  = 130; // ms per keystroke

  // ── Rain state ────────────────────────────────────────────────────
  const FPS=20, STEP_MS=1000/FPS;
  let lastT=0;

  // ── Helpers ───────────────────────────────────────────────────────
  function randRange(a,b){ return a+Math.random()*(b-a); }
  function randInt(a,b){ return Math.floor(randRange(a,b+1)); }

  // ── Sizing ────────────────────────────────────────────────────────
  function chunkSize(){
    const W=window.innerWidth;
    const cols=Math.max(7,Math.floor(W/55));
    const cw=Math.floor(W/cols);
    return {cw, ch:Math.round(cw*1.28)};
  }

  function applyFont(){
    const snap=Math.max(9,Math.round(FONT_PX/9)*9);
    ctx.font=`bold ${snap}px 'BoutiqueBitmap9x9',"Press Start 2P",monospace`;
    ctx.textAlign='center';
    ctx.textBaseline='alphabetic';
    ctx.imageSmoothingEnabled=false;
  }

  function resize(){
    const wr=document.getElementById('c64-screen-wrapper').getBoundingClientRect();
    const {cw,ch}=chunkSize();
    CELL_W=cw; CELL_H=ch;
    FONT_PX=Math.max(8,Math.floor(cw*0.86));
    cvs.width =Math.round(wr.width);
    cvs.height=Math.round(wr.height);
    COLS=Math.ceil(cvs.width /CELL_W);
    ROWS=Math.ceil(cvs.height/CELL_H);
    applyFont();
    ctx.fillStyle=bg();
    ctx.fillRect(0,0,cvs.width,cvs.height);
    grid=Array.from({length:COLS},()=>new Array(ROWS).fill(' '));
    columns=Array.from({length:COLS},(_,i)=>makeColumn(i));
    // Recompute boot row positions after resize
    const wrapRows=Math.ceil(LOAD_CMD.length/COLS);
    SEARCH_ROW=CMD_ROW+wrapRows+1;
  }

  // ── Grid drawing ──────────────────────────────────────────────────
  function fillBg(){
    ctx.fillStyle=bg();
    ctx.fillRect(0,0,cvs.width,cvs.height);
  }

  function clearGrid(){
    for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++) grid[c][r]=' ';
    fillBg();
  }

  // Draw a single character into a grid cell
  function drawCh(col,row,ch,color){
    if(col<0||col>=COLS||row<0||row>=ROWS) return;
    const px=col*CELL_W, py=row*CELL_H;
    ctx.fillStyle=bg(); ctx.fillRect(px,py,CELL_W,CELL_H);
    grid[col][row]=ch;
    if(ch===' ') return;
    ctx.fillStyle=color;
    ctx.fillText(ch,px+CELL_W/2,py+CELL_H-Math.floor(CELL_H*0.1));
  }

  // Print a string left-to-right, wrapping at COLS
  function printAt(col,row,str,color){
    let c=col,r=row;
    for(const ch of str){
      drawCh(c,r,ch,color);
      if(++c>=COLS){ c=0; r++; }
    }
  }

  // ── Boot sequence ─────────────────────────────────────────────────
  function startBoot(){
    frame.style.background=fCol();
    clearGrid();
    const LB=PALETTE[14]; // light blue for text
    printAt(0,0,'**** C64 BASIC V2 ****',LB);
    printAt(0,2,'64K RAM SYSTEM',LB);
    printAt(0,4,'READY.',LB);
    drawCh(0,CMD_ROW,'█',LB);        // cursor before LOAD cmd
    bootState='typing';
    stateStart=performance.now();
    typingPos=0; lastTypeTime=0;
  }

  // ── Sprites ───────────────────────────────────────────────────────
  function drawSprite(c,r,color,si){
    if(c<0||c>=COLS||r<0||r>=ROWS) return;
    const bmp=SPRITES[si%SPRITES.length];
    const px=c*CELL_W, py=r*CELL_H;
    ctx.fillStyle=bg(); ctx.fillRect(px,py,CELL_W,CELL_H);
    const pw=Math.max(1,Math.floor(CELL_W/8));
    const ph=Math.max(1,Math.floor(CELL_H/8));
    const ox=Math.floor((CELL_W-pw*8)/2);
    const oy=Math.floor((CELL_H-ph*8)/2);
    ctx.fillStyle=color;
    for(let row=0;row<8;row++){
      for(let bit=0;bit<8;bit++){
        if(bmp[row]&(0b10000000>>bit)){
          ctx.fillRect(px+ox+bit*pw,py+oy+row*ph,pw,ph);
        }
      }
    }
    grid[c][r]=INV_SENTINELS[si%3];
  }

  // ── Rain helpers ──────────────────────────────────────────────────
  function rebuildChars(){
    let s='';
    if(cbEn.checked) s+=EN_CHARS;
    if(cbZh.checked) s+=ZH_CHARS;
    activeChars=s||EN_CHARS;
  }

  function randHeadChar(){
    if(cbInv.checked&&Math.random()<1/6) return INV_SENTINELS[Math.random()*3|0];
    return activeChars[Math.random()*activeChars.length|0]||'@';
  }

  function makeColumn(x){
    const sp=(Math.random()*4|0)+1;
    return{x,row:Math.random()*ROWS|0,speed:sp,delay:sp,len:(Math.random()*16|0)+6};
  }

  function drawCell(c,r,ch,color){
    if(c<0||c>=COLS||r<0||r>=ROWS) return;
    const px=c*CELL_W, py=r*CELL_H;
    ctx.fillStyle=bg(); ctx.fillRect(px,py,CELL_W,CELL_H);
    grid[c][r]=ch;
    if(ch===' ') return;
    const si=INV_SENTINELS.indexOf(ch);
    if(si>=0){ drawSprite(c,r,color,si); return; }
    ctx.fillStyle=color;
    ctx.fillText(ch,px+CELL_W/2,py+CELL_H-Math.floor(CELL_H*0.1));
  }

  function recolour(c,r,color){
    if(c<0||c>=COLS||r<0||r>=ROWS) return;
    const ch=grid[c][r];
    if(ch===' ') return;
    const si=INV_SENTINELS.indexOf(ch);
    if(si>=0){ drawSprite(c,r,color,si); return; }
    const px=c*CELL_W, py=r*CELL_H;
    ctx.fillStyle=bg(); ctx.fillRect(px,py,CELL_W,CELL_H);
    ctx.fillStyle=color;
    ctx.fillText(ch,px+CELL_W/2,py+CELL_H-Math.floor(CELL_H*0.1));
  }

  function updateMatrix(){
    for(let x=0;x<COLS;x++){
      const col=columns[x];
      if(--col.delay>0) continue;
      col.delay=col.speed; col.row++;
      if(col.row-col.len>=ROWS){
        col.row=0; col.speed=(Math.random()*4|0)+1;
        col.delay=col.speed; col.len=(Math.random()*16|0)+6;
      }
      const r=col.row;
      drawCell(x,r-col.len,' ',bg());
      recolour(x,r-col.len+1,DIM_HEX);
      recolour(x,r-2,tr2());
      recolour(x,r-1,tr1());
      const ch=randHeadChar();
      const si=INV_SENTINELS.indexOf(ch);
      if(si>=0) drawSprite(x,r,head(),si);
      else      drawCell(x,r,ch,head());
    }
  }

  // ── Main loop ─────────────────────────────────────────────────────
  function tick(now){
    requestAnimationFrame(tick);
    const elapsed=now-stateStart;
    const LB=PALETTE[14];

    if(bootState==='typing'){
      // Cursor blink
      if(now-lastCursorToggle>350){
        cursorOn=!cursorOn; lastCursorToggle=now;
        const cc=typingPos%COLS, cr=CMD_ROW+Math.floor(typingPos/COLS);
        drawCh(cc,cr,cursorOn?'█':' ',LB);
      }
      // Type next character
      if(now-lastTypeTime>TYPE_DELAY&&typingPos<LOAD_CMD.length){
        const cc=typingPos%COLS, cr=CMD_ROW+Math.floor(typingPos/COLS);
        drawCh(cc,cr,LOAD_CMD[typingPos],LB);
        typingPos++;
        const nc=typingPos%COLS, nr=CMD_ROW+Math.floor(typingPos/COLS);
        drawCh(nc,nr,'█',LB);
        lastTypeTime=now;
      }
      // Enter pressed — wait a beat then proceed
      if(typingPos>=LOAD_CMD.length&&elapsed>LOAD_CMD.length*TYPE_DELAY+900){
        // erase trailing cursor
        const nc=typingPos%COLS, nr=CMD_ROW+Math.floor(typingPos/COLS);
        drawCh(nc,nr,' ',LB);
        bootState='searching'; stateStart=now;
      }

    } else if(bootState==='searching'){
      if(elapsed>350){
        printAt(0,SEARCH_ROW,'SEARCHING FOR CHUNKY_MATRIX',LB);
        bootState='found'; stateStart=now;
      }

    } else if(bootState==='found'){
      if(elapsed>1600){
        const loadRow=SEARCH_ROW+Math.ceil(28/COLS)+1;
        printAt(0,loadRow,'LOADING',LB);
        bootState='loading'; stateStart=now;
        loadDuration=randRange(3500,8000);
      }

    } else if(bootState==='loading'){
      // PETSCII chaos — fill random chunky cells in random C64 colours
      const writes=randInt(8,20);
      for(let w=0;w<writes;w++){
        const c=Math.floor(Math.random()*COLS);
        const r=Math.floor(Math.random()*ROWS);
        const ch=NOISE_CHARS[Math.floor(Math.random()*NOISE_CHARS.length)];
        drawCh(c,r,ch,PALETTE[Math.floor(Math.random()*16)]);
      }
      if(elapsed>loadDuration){
        clearGrid();
        printAt(0,1,'READY.',LB);
        drawCh(0,3,'█',LB);
        bootState='ready'; stateStart=now; cursorOn=true;
      }

    } else if(bootState==='ready'){
      // Cursor blink
      if(now-lastCursorToggle>400){
        cursorOn=!cursorOn; lastCursorToggle=now;
        drawCh(0,3,cursorOn?'█':' ',LB);
      }
      // Type R·U·N
      if(elapsed>1200) drawCh(0,4,'R',LB);
      if(elapsed>1290) drawCh(1,4,'U',LB);
      if(elapsed>1380) drawCh(2,4,'N',LB);
      if(elapsed>2200){
        bootState='rain'; stateStart=now;
        matrixActive=true;
        rebuildChars();
        clearGrid();
        columns=Array.from({length:COLS},(_,i)=>makeColumn(i));
        if(cbSnd.checked) snd.play().catch(()=>{});
      }

    } else if(bootState==='rain'){
      if(now-lastT>=STEP_MS){
        lastT=now-((now-lastT)%STEP_MS);
        updateMatrix();
      }
    }
  }

  // ── Tap to cycle colours ─────────────────────────────────────────
  // Tap a character → cycle Matrix head colour
  // Tap empty area  → cycle background colour
  // Tap frame border (outside screen) → cycle frame colour
  cvs.addEventListener('click', e=>{
    if(!matrixActive) return;
    const c=Math.floor(e.offsetX/CELL_W);
    const r=Math.floor(e.offsetY/CELL_H);
    const ch=(c>=0&&c<COLS&&r>=0&&r<ROWS)?grid[c][r]:' ';
    if(ch!==' '&&!INV_SENTINELS.includes(ch)){
      headIdx=(headIdx+1)%16;
    } else {
      bgIdx=(bgIdx+1)%16;
      fillBg();
    }
  });

  frame.addEventListener('click', e=>{
    if(!matrixActive) return;
    if(e.target.closest('#c64-screen-wrapper')) return;
    if(e.target.closest('#c64-controls')) return;
    frameIdx=(frameIdx+1)%16;
    frame.style.background=fCol();
  });

  // ── Checkbox listeners ────────────────────────────────────────────
  [cbZh,cbEn,cbInv].forEach(cb=>cb.addEventListener('change',rebuildChars));
  cbSnd.addEventListener('change',()=>{ cbSnd.checked?snd.play().catch(()=>{}):snd.pause(); });
  document.addEventListener('click',()=>{ if(cbSnd.checked) snd.play().catch(()=>{}); },{once:true});

  window.addEventListener('resize',()=>{
    resize();
    if(bootState==='rain'){
      columns=Array.from({length:COLS},(_,i)=>makeColumn(i));
    }
  },{passive:true});

  // ── Start — wait for fonts ────────────────────────────────────────
  document.fonts.ready.then(()=>{
    resize();
    startBoot();
    requestAnimationFrame(tick);
  });

})();
</script>
</body>
</html>
