<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/gh/polerix/ 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/gh/polerix/ https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Chunky Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'BoutiqueBitmap9x9';
  src: url('BoutiqueBitmap9x9_Bold.ttf') format('truetype');
  font-weight: bold;
  font-display: block;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; }

/* C64 screenframe — colour 14 light blue */
#c64-frame {
  position:fixed; inset:0;
  background:#7869C4;
  display:flex; flex-direction:column; align-items:stretch;
  padding: clamp(12px,2.8vw,36px);
}

/* C64 screen area — colour 6 dark blue */
#c64-screen-wrapper {
  flex:1; position:relative; overflow:hidden;
  background:#40318D;
}

#matrix-cvs {
  /* Canvas is a replaced element — inset:0 alone does NOT stretch it to
     fill the container; without explicit width/height it falls back to
     its intrinsic size, which for canvas is its width/height ATTRIBUTES.
     Those attributes are set to CSS_W*devicePixelRatio in JS (the backing
     store), so without this, the on-screen box became devicePixelRatio×
     too large on any HiDPI screen, clipped by this wrapper's
     overflow:hidden — exactly the real-device mobile bug. */
  position:absolute; inset:0; width:100%; height:100%;
}

/* Control strip in the frame */
#c64-controls {
  flex-shrink:0;
  padding: clamp(4px,.8vw,9px) clamp(8px,1.8vw,18px);
  display:flex; align-items:center; gap:clamp(10px,2.5vw,26px);
  font-family:'Press Start 2P', monospace;
  font-size: clamp(6px,1.1vw,10px);
  color: rgba(210,210,255,0.9);
  user-select:none;
}
#c64-controls label { display:flex; align-items:center; gap:clamp(4px,.7vw,7px); cursor:pointer; }
#c64-controls input[type="checkbox"] {
  appearance:none; -webkit-appearance:none;
  width:clamp(8px,1.2vw,13px); height:clamp(8px,1.2vw,13px);
  border:2px solid rgba(180,180,255,.7);
  background:transparent; cursor:pointer; flex-shrink:0; position:relative;
}
#c64-controls input[type="checkbox"]:checked { background:rgba(180,180,255,.7); }
#c64-controls input[type="checkbox"]:checked::after {
  content:''; position:absolute; inset:2px; background:#40318D;
  clip-path:polygon(20% 50%,40% 75%,80% 20%,80% 30%,40% 85%,20% 60%);
}
.ctrl-div { color:rgba(160,160,220,.4); }
/* prevent scroll-cancel on hold gestures */
#matrix-cvs { touch-action: none; }
/* discoverable tap-zone hint — positioned within the screen wrapper (not
   fixed to the viewport) so it can never collide with #c64-controls below
   it; on mobile the frame's padding shrinks enough that a viewport-fixed
   bottom offset landed right on top of the controls row. Backing plate
   (background+padding) so it stays legible over the rain it sits on top
   of — without one, falling glyphs render through the text, both hard to
   read (confirmed on a real device, portrait). */
#colour-hint {
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  max-width:92%; overflow:hidden; text-overflow:ellipsis;
  background:rgba(0,0,0,0.7); padding:.4em .7em;
  font-family:'Press Start 2P',monospace; font-size:clamp(5px,1.4vw,8px);
  color:rgba(148,224,137,0.95);
  white-space:nowrap; pointer-events:none; z-index:20;
  transition:opacity 1.5s; opacity:0;
}
</style>
</head>
<body>
<div id="c64-frame">
  <div id="c64-screen-wrapper">
    <canvas id="matrix-cvs"></canvas>
    <div id="colour-hint">tap glyph &middot; tap space &middot; tap frame &nbsp;|&nbsp; hold = fast-cycle</div>
  </div>
  <div id="c64-controls">
    <label title="Katakana + kanji"><input type="checkbox" id="cb-zh" checked> 日 CJK</label>
    <span class="ctrl-div">|</span>
    <label title="A-Z symbols"><input type="checkbox" id="cb-en" checked> ABC</label>
    <span class="ctrl-div">|</span>
    <label title="Space Invaders"><input type="checkbox" id="cb-inv" checked> SIG</label>
    <span class="ctrl-div">|</span>
    <label title="Sound on/off"><input type="checkbox" id="cb-snd" checked> SND</label>
  </div>
</div>
<audio id="snd" src="soundtrack.mp4" loop preload="auto"></audio>
<script>
'use strict';
// ════════════════════════════════════════════════════════════════════
// CHUNKY MATRIX — single canvas, boot sequence + rain in one IIFE
// Boot text uses same chunky font & cell size as the Matrix rain.
// Tap glyph → cycle head colour. Tap empty → cycle bg colour.
// Tap frame border → cycle frame colour. All 16 C64 Pepto colours.
// ════════════════════════════════════════════════════════════════════
(function(){

  // ── Pepto C64 palette (16 colours) ───────────────────────────────
  const PALETTE = [
    '#000000','#FFFFFF','#883932','#67B6BD',
    '#8B3F96','#55A049','#40318D','#BFCE72',
    '#8B5429','#574200','#B86962','#505050',
    '#787878','#94E089','#7869C4','#9F9F9F'
  ];

  // Mutable colour indices — tap cycles through palette
  let bgIdx    = 6;   // C64 colour 6 dark blue
  let frameIdx = 14;  // C64 colour 14 light blue
  let headIdx  = 1;   // white (Matrix head)
  const TR1_IDX = 13; // light green  (trail -1)
  const TR2_IDX =  5; // green        (trail -2)
  const DIM_HEX = '#1d381d'; // dim — no palette entry

  const bg   = () => PALETTE[bgIdx];
  const head = () => PALETTE[headIdx];
  const tr1  = () => PALETTE[TR1_IDX];
  const tr2  = () => PALETTE[TR2_IDX];
  const fCol = () => PALETTE[frameIdx];

  // ── DOM ──────────────────────────────────────────────────────────
  const cvs   = document.getElementById('matrix-cvs');
  const ctx   = cvs.getContext('2d');
  const frame = document.getElementById('c64-frame');
  const snd   = document.getElementById('snd');
  const cbZh  = document.getElementById('cb-zh');
  const cbEn  = document.getElementById('cb-en');
  const cbInv = document.getElementById('cb-inv');
  const cbSnd = document.getElementById('cb-snd');

  // ── Debug overlay (?debug=1) ─────────────────────────────────────
  // On-screen readout of every width/height signal the layout math touches,
  // so a real device can report ground truth in one round trip instead of
  // guessing from emulation (which has already proven unreliable for this
  // class of bug — emulated Chrome measured 24-34 columns on a viewport
  // where a real iPhone Safari was visibly rendering ~7-10). Zero effect
  // on normal (non-debug) page loads.
  const DEBUG = /[?&]debug=1(?:&|$)/.test(location.search);
  let debugEl = null;
  if (DEBUG) {
    debugEl = document.createElement('div');
    debugEl.id = 'debug-overlay';
    debugEl.style.cssText =
      'position:fixed;top:0;left:0;right:0;z-index:99999;'+
      'background:rgba(0,0,0,0.5);color:#7CFC7C;text-shadow:0 1px 2px #000;'+
      'font:10px/1.5 -apple-system,monospace;padding:6px 8px;'+
      'white-space:pre-wrap;pointer-events:none;'+
      'max-height:60vh;overflow:auto;';
    document.body.appendChild(debugEl);
  }

  function updateDebugOverlay(){
    if (!DEBUG || !debugEl) return;
    const wrapEl = document.getElementById('c64-screen-wrapper');
    const wr = wrapEl.getBoundingClientRect();
    const cvsRect = cvs.getBoundingClientRect();
    const vv = window.visualViewport;
    const lines = [
      `devicePixelRatio: ${window.devicePixelRatio}`,
      `window.innerWidth/Height: ${window.innerWidth} / ${window.innerHeight}`,
      `documentElement.clientWidth/Height: ${document.documentElement.clientWidth} / ${document.documentElement.clientHeight}`,
      `visualViewport: ${vv ? `${vv.width.toFixed(1)} x ${vv.height.toFixed(1)} (scale=${vv.scale}, offsetLeft=${vv.offsetLeft.toFixed(1)}, offsetTop=${vv.offsetTop.toFixed(1)})` : 'unsupported'}`,
      `#c64-screen-wrapper getBoundingClientRect: ${wr.width.toFixed(1)} x ${wr.height.toFixed(1)}`,
      `#c64-screen-wrapper clientWidth/Height: ${wrapEl.clientWidth} / ${wrapEl.clientHeight}`,
      `#matrix-cvs getBoundingClientRect (CSS size on screen): ${cvsRect.width.toFixed(1)} x ${cvsRect.height.toFixed(1)}`,
      `#matrix-cvs backing store (cvs.width/height): ${cvs.width} x ${cvs.height}`,
      `CSS_W/CSS_H (what resize() measured): ${CSS_W.toFixed(1)} / ${CSS_H.toFixed(1)}`,
      `CELL_W/CELL_H: ${CELL_W} / ${CELL_H}`,
      `FONT_PX: ${FONT_PX}`,
      `COLS/ROWS: ${COLS} / ${ROWS}`,
      `COLS*CELL_W (total content width): ${COLS*CELL_W} vs canvas CSS width ${cvsRect.width.toFixed(1)}`,
      `orientation: ${screen.orientation ? screen.orientation.type : 'n/a'}`,
      `bootState: ${bootState}`,
    ];
    debugEl.textContent = lines.join('\n');
  }
  // iOS Safari doesn't always fire 'resize' when the address bar collapses
  // or the visual viewport otherwise changes without a layout viewport
  // change — poll while debug mode is on so the readout can't go stale.
  if (DEBUG) setInterval(updateDebugOverlay, 1000);

  // ── Character sets ────────────────────────────────────────────────
  const EN_CHARS    = '@ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*=';
  const ZH_CHARS    = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ' +
                      'マミムメモヤユヨラリルレロワヲン日月火水木金土山川田林森石人' +
                      '口大小上下左右中白黒夜雨風空電雲星龍鬼神道';
  const NOISE_CHARS = '█▓▒░▚▞▟▙▜▛▄▀▌▐■□▲▼◆◇●○♠♣♥♦☺☻@#%&*+=<>/\\|-_~^0123456789';

  // Space Invader bitmaps (8×8, MSB=left)
  const SPRITES = [
    [0b00100100,0b00011000,0b00111100,0b01101110,0b11111111,0b10111101,0b10000001,0b01100110],
    [0b00011000,0b00111100,0b01111110,0b11011011,0b11111111,0b00100100,0b01011010,0b10100101],
    [0b00111100,0b01111110,0b11111111,0b11011011,0b11111111,0b00100100,0b01011010,0b10100101],
  ];
  const INV_SENTINELS = ['\x01','\x02','\x03'];

  // ── Layout ───────────────────────────────────────────────────────
  let COLS=0, ROWS=0, CELL_W=0, CELL_H=0, FONT_PX=0;
  let CSS_W=0, CSS_H=0; // drawable size in CSS px (canvas backing store is CSS_W/H * devicePixelRatio)
  let grid=[], columns=[], activeChars='';

  // ── Boot state ────────────────────────────────────────────────────
  // init → typing → searching → found → loading → ready → rain
  let bootState='init', stateStart=0;
  let typingPos=0, lastTypeTime=0;
  let cursorOn=true, lastCursorToggle=0;
  let loadDuration=0, matrixActive=false;
  let CMD_ROW=9, SEARCH_ROW=12;
  // Boot-text row positions — adaptive, see computeBootRows(). Defaults
  // are the authentic spacing, used whenever ROWS is tall enough for it.
  let ROW_HEADER=2, ROW_RAM=5, ROW_READY=7;
  // PETSCII linear sweep state
  let chaosPos=0, chaosTotal=0, chaosBatch=0;
  // rain frame counter (drives the travelling wave in updateMatrix)
  let rainFrame=0;
  const LOAD_CMD    = 'LOAD "CHUNKY-MATRIX",8,1';
  const TYPE_DELAY  = 130; // ms per keystroke

  // ── Rain state ────────────────────────────────────────────────────
  const FPS=20, STEP_MS=1000/FPS;
  let lastT=0;

  // ── Helpers ───────────────────────────────────────────────────────
  function randRange(a,b){ return a+Math.random()*(b-a); }
  function randInt(a,b){ return Math.floor(randRange(a,b+1)); }

  // ── Sizing ────────────────────────────────────────────────────────
  // Cell width scales with the actual drawable (CSS px) width, not a fixed
  // desktop-tuned divisor — the old `Math.floor(W/55)` gave a flat ~55px
  // cell at ANY width, so a 390px phone got exactly 7 giant columns (the
  // same 7 you'd get from a 500px desktop window). targetCols grows with W
  // but is clamped on both ends: floor of 24 guarantees the 22-char boot
  // header ("**** C64 BASIC V2 ****") always fits with margin, even at a
  // 320px-wide phone after frame padding eats into it; ceiling of 34 keeps
  // cells "chunky" (this is Chunky Matrix) instead of shrinking to normal
  // terminal density on a large desktop window.
  // H constrains the same cw: a short (landscape) viewport sized purely
  // from width can end up with a cell tall enough that ROWS drops below
  // what the boot screen needs (its fixed-looking rows go through
  // computeBootRows() below, but they still need SOME minimum headroom)
  // and rain rows get clipped by the controls row. MIN_ROWS=14 comfortably
  // covers the 10-row authentic boot layout with margin.
  function chunkSize(W,H){
    const targetCols=Math.max(24,Math.min(34,Math.round(W/16)));
    let cw=Math.max(9,Math.floor(W/targetCols));
    // 16, not 10: the derived SEARCH_ROW/loadRow (searching/loading states,
    // computed from CMD_ROW in resize()) can land 1-2 rows past CMD_ROW
    // when COLS is at the low end of its clamp — 16 keeps those in bounds
    // too, not just the header/64K/READY/CMD rows computeBootRows() covers.
    const MIN_ROWS=16;
    if(H/Math.round(cw*1.28)<MIN_ROWS){
      cw=Math.max(9,Math.floor((H/MIN_ROWS)/1.28));
    }
    return {cw, ch:Math.round(cw*1.28)};
  }

  // Boot-text row positions. The authentic C64 spacing (2 blank lines
  // between header and "64K RAM SYSTEM", etc.) needs 10 rows (0-9); a
  // short landscape-phone viewport can have far fewer even after the
  // height constraint above. Compress proportionally instead of using
  // fixed rows that silently render below the visible area — that's what
  // made a short landscape boot screen show almost nothing but the header.
  function computeBootRows(){
    const AUTHENTIC_ROWS_NEEDED=10; // CMD_ROW=9 is the last one, 0-indexed
    if(ROWS>=AUTHENTIC_ROWS_NEEDED){
      ROW_HEADER=2; ROW_RAM=5; ROW_READY=7; CMD_ROW=9;
      return;
    }
    const last=Math.max(3,ROWS-1);
    ROW_HEADER=0;
    ROW_RAM=Math.max(1,Math.round(last/3));
    ROW_READY=Math.max(ROW_RAM+1,Math.round(last*5/9));
    CMD_ROW=Math.max(ROW_READY+1,last);
  }

  function applyFont(){
    const snap=Math.max(9,Math.round(FONT_PX/9)*9);
    ctx.font=`bold ${snap}px 'BoutiqueBitmap9x9',"Press Start 2P",monospace`;
    ctx.textAlign='center';
    ctx.textBaseline='alphabetic';
    ctx.imageSmoothingEnabled=false;
  }

  // Returns false if the wrapper hasn't been laid out yet (0×0 rect — can
  // happen right when the font promise resolves, before the first layout
  // pass). Callers must not touch COLS/ROWS/grid on a false return, or a
  // 0/0 division leaves COLS/ROWS as NaN and the grid empty.
  function resize(){
    const wr=document.getElementById('c64-screen-wrapper').getBoundingClientRect();
    if(wr.width<1||wr.height<1) return false;
    CSS_W=wr.width; CSS_H=wr.height;
    const {cw,ch}=chunkSize(CSS_W,CSS_H);
    CELL_W=cw; CELL_H=ch;
    FONT_PX=Math.max(8,Math.floor(cw*0.86));
    // Canvas backing store is sized in device pixels (CSS px * DPR) so text
    // renders crisp on a HiDPI/Retina screen instead of soft/blurry. The
    // element's on-screen CSS size comes from #matrix-cvs{inset:0; width:
    // 100%; height:100%} filling the wrapper — the explicit width/height
    // are required: canvas is a replaced element, so inset:0 ALONE does
    // not stretch it to fill the container, it falls back to its
    // intrinsic size (its width/height attributes below), which would
    // make the on-screen box devicePixelRatio× too large, clipped by this
    // wrapper's overflow:hidden. All draw calls keep using CSS-px
    // coordinates (CELL_W/H, CSS_W/H, etc.); the transform below scales
    // them into the higher-res backing store.
    const dpr=window.devicePixelRatio||1;
    cvs.width =Math.round(CSS_W*dpr);
    cvs.height=Math.round(CSS_H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    // Floor, not ceil: COLS*CELL_W must never exceed CSS_W (same for rows)
    // — a ceil here can round the total content size up past the drawable
    // area by up to one cell, which is real, visible overflow, not just a
    // rounding nicety. A floor leaves at most one cell's width of solid
    // background at the far edge instead, which reads as margin, not a bug.
    COLS=Math.max(1,Math.floor(CSS_W/CELL_W));
    ROWS=Math.max(1,Math.floor(CSS_H/CELL_H));
    applyFont();
    ctx.fillStyle=bg();
    ctx.fillRect(0,0,CSS_W,CSS_H);
    initColumns();
    computeBootRows();
    // Recompute boot row positions after resize
    const wrapRows=Math.ceil(LOAD_CMD.length/COLS);
    SEARCH_ROW=CMD_ROW+wrapRows+1;
    updateDebugOverlay();
    return true;
  }

  // ── Grid drawing ──────────────────────────────────────────────────
  function fillBg(){
    ctx.fillStyle=bg();
    ctx.fillRect(0,0,CSS_W,CSS_H);
  }

  function clearGrid(){
    for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++) grid[c][r]=' ';
    fillBg();
  }

  // Draw a single character into a grid cell
  function drawCh(col,row,ch,color){
    if(!(col>=0&&col<COLS&&row>=0&&row<ROWS)) return;
    const px=col*CELL_W, py=row*CELL_H;
    ctx.fillStyle=bg(); ctx.fillRect(px,py,CELL_W,CELL_H);
    grid[col][row]=ch;
    if(ch===' ') return;
    ctx.fillStyle=color;
    // '█' rendered via fillText can overflow the cell bottom by the font's
    // descent, leaving a persistent 1-2 px stripe that looks like an underline
    // under every character the cursor visited.  Draw it as a fillRect instead
    // so it is always strictly contained within (px, py, CELL_W, CELL_H).
    if(ch==='█'){ ctx.fillRect(px,py,CELL_W,CELL_H); return; }
    ctx.fillText(ch,px+CELL_W/2,py+CELL_H-Math.floor(CELL_H*0.1));
  }

  // Print a string left-to-right, wrapping at COLS
  function printAt(col,row,str,color){
    let c=col,r=row;
    for(const ch of str){
      drawCh(c,r,ch,color);
      if(++c>=COLS){ c=0; r++; }
    }
  }

  // Print a single line that must land on exactly one row — truncates
  // instead of wrapping, so boot text with fixed row spacing (the header,
  // "2 blank lines" rule) can't be corrupted by a narrow COLS pushing it
  // onto the next row.
  function printLine(col,row,str,color){
    let c=Math.max(0,col);
    for(const ch of str){
      if(c>=COLS) break;
      drawCh(c,row,ch,color);
      c++;
    }
  }

  // ── Boot sequence ─────────────────────────────────────────────────
  function startBoot(){
    frame.style.background=fCol();
    clearGrid();
    const LB=PALETTE[14]; // light blue for text
    // Authentic C64 layout when ROWS>=10 (2 blank lines between header and
    // 64K, etc — rows 2/5/7/9); compressed proportionally on a shorter
    // viewport instead — see computeBootRows(), called from resize()
    // before this runs, so ROW_HEADER/ROW_RAM/ROW_READY/CMD_ROW are
    // already set for the current ROWS.
    const headerStr='**** C64 BASIC V2 ****';
    printLine(Math.floor((COLS-headerStr.length)/2),ROW_HEADER,headerStr,LB);
    printLine(0,ROW_RAM,'64K RAM SYSTEM',LB);
    printLine(0,ROW_READY,'READY.',LB);
    drawCh(0,CMD_ROW,'█',LB);        // cursor before LOAD cmd
    bootState='waiting';              // ~1Hz blink pause before typing
    stateStart=performance.now();
    cursorOn=true; lastCursorToggle=performance.now();
  }

  // ── Sprites ───────────────────────────────────────────────────────
  function drawSprite(c,r,color,si){
    if(!(c>=0&&c<COLS&&r>=0&&r<ROWS)) return;
    const bmp=SPRITES[si%SPRITES.length];
    const px=c*CELL_W, py=r*CELL_H;
    ctx.fillStyle=bg(); ctx.fillRect(px,py,CELL_W,CELL_H);
    const pw=Math.max(1,Math.floor(CELL_W/8));
    const ph=Math.max(1,Math.floor(CELL_H/8));
    const ox=Math.floor((CELL_W-pw*8)/2);
    const oy=Math.floor((CELL_H-ph*8)/2);
    ctx.fillStyle=color;
    for(let row=0;row<8;row++){
      for(let bit=0;bit<8;bit++){
        if(bmp[row]&(0b10000000>>bit)){
          ctx.fillRect(px+ox+bit*pw,py+oy+row*ph,pw,ph);
        }
      }
    }
    grid[c][r]=INV_SENTINELS[si%3];
  }

  // ── Rain helpers ──────────────────────────────────────────────────
  function rebuildChars(){
    let s='';
    if(cbEn.checked) s+=EN_CHARS;
    if(cbZh.checked) s+=ZH_CHARS;
    activeChars=s||EN_CHARS;
  }

  function randHeadChar(){
    if(cbInv.checked&&Math.random()<1/6) return INV_SENTINELS[Math.random()*3|0];
    return activeChars[Math.random()*activeChars.length|0]||'@';
  }

  function makeColumn(x){
    const sp=(Math.random()*4|0)+1;
    return{x,row:Math.random()*ROWS|0,speed:sp,delay:sp,len:(Math.random()*16|0)+6};
  }

  function initColumns(){
    grid=Array.from({length:COLS},()=>new Array(ROWS).fill(' '));
    columns=Array.from({length:COLS},(_,i)=>makeColumn(i));
  }

  function drawCell(c,r,ch,color){
    if(!(c>=0&&c<COLS&&r>=0&&r<ROWS)) return;
    const px=c*CELL_W, py=r*CELL_H;
    ctx.fillStyle=bg(); ctx.fillRect(px,py,CELL_W,CELL_H);
    grid[c][r]=ch;
    if(ch===' ') return;
    const si=INV_SENTINELS.indexOf(ch);
    if(si>=0){ drawSprite(c,r,color,si); return; }
    ctx.fillStyle=color;
    ctx.fillText(ch,px+CELL_W/2,py+CELL_H-Math.floor(CELL_H*0.1));
  }

  function recolour(c,r,color){
    if(!(c>=0&&c<COLS&&r>=0&&r<ROWS)) return;
    const ch=grid[c][r];
    if(ch===' ') return;
    const si=INV_SENTINELS.indexOf(ch);
    if(si>=0){ drawSprite(c,r,color,si); return; }
    const px=c*CELL_W, py=r*CELL_H;
    ctx.fillStyle=bg(); ctx.fillRect(px,py,CELL_W,CELL_H);
    ctx.fillStyle=color;
    ctx.fillText(ch,px+CELL_W/2,py+CELL_H-Math.floor(CELL_H*0.1));
  }

  function updateMatrix(){
    rainFrame++;
    for(let x=0;x<COLS;x++){
      const col=columns[x];
      // Travelling wave: each column's phase is offset by its x, so a crest
      // sweeps across the columns and gives the ones it passes an occasional
      // extra tick. There are no column groups; phase is a smooth function of x.
      const waveBoost=Math.sin(rainFrame*0.05-col.x*0.25)>0.82?1:0;
      col.delay=Math.max(0,col.delay-1-waveBoost);
      if(col.delay>0) continue;
      col.delay=col.speed; col.row++;
      if(col.row-col.len>=ROWS){
        col.row=0; col.speed=(Math.random()*4|0)+1;
        col.delay=col.speed; col.len=(Math.random()*16|0)+6;
      }
      const r=col.row;
      drawCell(x,r-col.len,' ',bg());
      recolour(x,r-col.len+1,DIM_HEX);
      recolour(x,r-2,tr2());
      recolour(x,r-1,tr1());
      const ch=randHeadChar();
      const si=INV_SENTINELS.indexOf(ch);
      if(si>=0) drawSprite(x,r,head(),si);
      else      drawCell(x,r,ch,head());
    }
  }

  // ── Main loop ─────────────────────────────────────────────────────
  function tick(now){
    requestAnimationFrame(tick);
    const elapsed=now-stateStart;
    const LB=PALETTE[14];

    if(bootState==='waiting'){
      // ~1 Hz cursor blink before the user "types" LOAD
      if(now-lastCursorToggle>500){
        cursorOn=!cursorOn; lastCursorToggle=now;
        drawCh(0,CMD_ROW,cursorOn?'█':' ',LB);
      }
      if(elapsed>1500){
        cursorOn=false; drawCh(0,CMD_ROW,' ',LB);
        bootState='typing'; stateStart=now;
        typingPos=0; lastTypeTime=now;
      }

    } else if(bootState==='typing'){
      // Cursor blink
      if(now-lastCursorToggle>350){
        cursorOn=!cursorOn; lastCursorToggle=now;
        const cc=typingPos%COLS, cr=CMD_ROW+Math.floor(typingPos/COLS);
        drawCh(cc,cr,cursorOn?'█':' ',LB);
      }
      // Type next character
      if(now-lastTypeTime>TYPE_DELAY&&typingPos<LOAD_CMD.length){
        const cc=typingPos%COLS, cr=CMD_ROW+Math.floor(typingPos/COLS);
        drawCh(cc,cr,LOAD_CMD[typingPos],LB);
        typingPos++;
        const nc=typingPos%COLS, nr=CMD_ROW+Math.floor(typingPos/COLS);
        drawCh(nc,nr,'█',LB);
        lastTypeTime=now;
      }
      // Enter pressed — wait a beat then proceed
      if(typingPos>=LOAD_CMD.length&&elapsed>LOAD_CMD.length*TYPE_DELAY+900){
        // erase trailing cursor
        const nc=typingPos%COLS, nr=CMD_ROW+Math.floor(typingPos/COLS);
        drawCh(nc,nr,' ',LB);
        bootState='searching'; stateStart=now;
      }

    } else if(bootState==='searching'){
      if(elapsed>350){
        printAt(0,SEARCH_ROW,'SEARCHING FOR CHUNKY-MATRIX',LB);
        bootState='found'; stateStart=now;
      }

    } else if(bootState==='found'){
      if(elapsed>1600){
        const loadRow=SEARCH_ROW+Math.ceil(28/COLS)+1;
        printAt(0,loadRow,'LOADING',LB);
        loadDuration=randRange(3500,8000);
        // set up linear PETSCII sweep
        chaosPos=0; chaosTotal=COLS*ROWS;
        // batch size: complete the sweep in ~loadDuration ms at ~60 fps
        chaosBatch=Math.max(2,Math.ceil(chaosTotal/(loadDuration/1000*60)));
        bootState='loading'; stateStart=now;
      }

    } else if(bootState==='loading'){
      // PETSCII chaos — linear sweep top-left → bottom-right (address order)
      const end=Math.min(chaosPos+chaosBatch,chaosTotal);
      for(let i=chaosPos;i<end;i++){
        const c=i%COLS, r=Math.floor(i/COLS);
        const ch=NOISE_CHARS[Math.floor(Math.random()*NOISE_CHARS.length)];
        drawCh(c,r,ch,PALETTE[Math.floor(Math.random()*16)]);
      }
      chaosPos=end;
      if(chaosPos>=chaosTotal){
        clearGrid();
        printLine(0,1,'READY.',LB);
        drawCh(0,3,'█',LB);
        bootState='ready'; stateStart=now; cursorOn=true; lastCursorToggle=now;
      }

    } else if(bootState==='ready'){
      // Cursor blink
      if(now-lastCursorToggle>400){
        cursorOn=!cursorOn; lastCursorToggle=now;
        drawCh(0,3,cursorOn?'█':' ',LB);
      }
      // Type R·U·N
      if(elapsed>1200) drawCh(0,4,'R',LB);
      if(elapsed>1290) drawCh(1,4,'U',LB);
      if(elapsed>1380) drawCh(2,4,'N',LB);
      if(elapsed>2200){
        bootState='rain'; stateStart=now;
        matrixActive=true;
        rainFrame=0;
        rebuildChars();
        clearGrid();
        initColumns();
        if(cbSnd.checked) snd.play().catch(()=>{});
        // show discoverable hint, fade after 5 s
        const hintEl=document.getElementById('colour-hint');
        hintEl.style.opacity='1';
        setTimeout(()=>{ hintEl.style.opacity='0'; },5000);
      }

    } else if(bootState==='rain'){
      if(now-lastT>=STEP_MS){
        lastT=now-((now-lastT)%STEP_MS);
        updateMatrix();
        // CJK and symbol glyphs can bleed pixels below the alphabetic baseline
        // into the strip between ROWS*CELL_H and CSS_H (and past COLS*CELL_W
        // on the right). Those pixels are never cleared by cell drawing, so
        // we erase the strips back to bg() after every matrix step.
        ctx.fillStyle=bg();
        const gB=ROWS*CELL_H, gR=COLS*CELL_W;
        if(gB<CSS_H) ctx.fillRect(0,gB,CSS_W,CSS_H-gB);
        if(gR<CSS_W) ctx.fillRect(gR,0,CSS_W-gR,CSS_H);
      }
    }
  }

  // ── Tap / hold to cycle colours ──────────────────────────────────
  // Short tap: single step.  Hold >500 ms: fast-cycle at 150 ms/step.
  // Tap glyph → head colour | tap empty → bg colour | tap frame → frame colour
  let holdTimer=null, cycleTimer=null, pointerTarget=null;

  function cancelHold(){ clearTimeout(holdTimer); holdTimer=null; clearInterval(cycleTimer); cycleTimer=null; }
  function doCycle(){
    if(pointerTarget==='head') { headIdx=(headIdx+1)%16; }
    else if(pointerTarget==='bg')   { bgIdx=(bgIdx+1)%16; fillBg(); }
    else if(pointerTarget==='frame'){ frameIdx=(frameIdx+1)%16; frame.style.background=fCol(); }
  }
  function armHold(target){
    pointerTarget=target;
    holdTimer=setTimeout(()=>{ holdTimer=null; doCycle(); cycleTimer=setInterval(doCycle,150); },500);
  }

  cvs.addEventListener('pointerdown', e=>{
    if(!matrixActive) return;
    const c=Math.floor(e.offsetX/CELL_W), r=Math.floor(e.offsetY/CELL_H);
    const ch=(c>=0&&c<COLS&&r>=0&&r<ROWS)?grid[c][r]:' ';
    armHold((ch!==' '&&!INV_SENTINELS.includes(ch))?'head':'bg');
  });
  cvs.addEventListener('pointerup', e=>{
    if(!matrixActive) return;
    if(cycleTimer){ cancelHold(); return; }
    if(holdTimer){ cancelHold(); doCycle(); }
  });
  cvs.addEventListener('pointercancel', cancelHold);

  frame.addEventListener('pointerdown', e=>{
    if(!matrixActive) return;
    if(e.target.closest('#c64-screen-wrapper')||e.target.closest('#c64-controls')) return;
    armHold('frame');
  });
  frame.addEventListener('pointerup', e=>{
    if(!matrixActive) return;
    if(e.target.closest('#c64-screen-wrapper')||e.target.closest('#c64-controls')) return;
    if(cycleTimer){ cancelHold(); return; }
    if(holdTimer){ cancelHold(); doCycle(); }
  });
  frame.addEventListener('pointercancel', cancelHold);

  // ── Checkbox listeners ────────────────────────────────────────────
  [cbZh,cbEn,cbInv].forEach(cb=>cb.addEventListener('change',rebuildChars));
  cbSnd.addEventListener('change',()=>{ cbSnd.checked?snd.play().catch(()=>{}):snd.pause(); });
  // Touch only counts as user activation on pointerup (not pointerdown), and a refused play() must be retried:
  // keep trying on each activation event until playback actually starts.
  const tryStartSnd=()=>{
    if(!cbSnd.checked) return;
    snd.play().then(()=>{ ['pointerup','keydown'].forEach(t=>document.removeEventListener(t,tryStartSnd)); },()=>{});
  };
  ['pointerup','keydown'].forEach(t=>document.addEventListener(t,tryStartSnd));

  // Real-device readout (iPhone 17 Pro, DPR3) caught resize()'s CSS_W/CSS_H
  // disagreeing with a getBoundingClientRect() of the SAME wrapper element
  // taken moments later — window 'resize' fired, but Safari's dynamic
  // toolbar/safe-area hadn't finished settling into its final size yet
  // (this happens after rotation especially), so resize() measured a
  // transient, not-yet-final layout. ResizeObserver fires strictly after
  // layout, for the box size the element ACTUALLY ends up at, however that
  // happened (rotation, toolbar collapse, anything) — the correct signal,
  // not a heuristic proxy for one. Observe the wrapper, not the canvas:
  // the canvas's own width/height ATTRIBUTE changes (set inside resize())
  // could self-trigger spurious notifications, the wrapper's box size only
  // changes from real layout causes.
  const wrapperEl = document.getElementById('c64-screen-wrapper');
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(()=>{
      resize();
      // Backstop: Safari can report one more, smaller settle shortly after
      // this fires (toolbar animation finishing) without a distinct
      // ResizeObserver entry for it — catch that too.
      requestAnimationFrame(()=>{ resize(); });
    });
    ro.observe(wrapperEl);
  } else {
    // Extremely old browser fallback — ResizeObserver has shipped in every
    // major engine (incl. Safari) since 2020.
    window.addEventListener('resize',()=>{ resize(); },{passive:true});
  }

  // ── Start — wait for fonts ────────────────────────────────────────
  // Use document.fonts.load() with the exact weight/size rather than
  // document.fonts.ready — the latter resolves as soon as the font *exists*
  // in the registry, before the first glyph is decoded.  fonts.load() blocks
  // until the face is fully decoded and ready to paint.  The off-screen
  // fillText warm-up then forces a real rasterise pass so the very first
  // visible character (the 'L' in 'LOAD') is guaranteed to use the bitmap
  // font rather than the system monospace fallback.
  // resize() can legitimately fail the first time it's called here (0×0
  // wrapper rect — the font promise sometimes resolves before the first
  // layout pass, especially on a warm font cache). Retry on the next
  // animation frame instead of booting with a corrupt COLS/ROWS/grid.
  function startWhenLaidOut(){
    if(!resize()){ requestAnimationFrame(startWhenLaidOut); return; }
    // Warm-up: force glyph decode before any visible character is drawn
    ctx.fillText('A', -100, -100);
    startBoot();
    requestAnimationFrame(tick);
  }

  document.fonts.load("bold 18px 'BoutiqueBitmap9x9'").then(startWhenLaidOut);

})();
</script>

  import('https://cdn.jsdelivr.net/gh/polerix/polerix-code-toolkit@v1.1.0/packages/web-core/index.mjs')
