<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chunky Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Press Start 2P: Latin pixel font | DotGothic16: pixel-art CJK+Latin -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

/* ── C64 SCREENFRAME — colour 14 Light Blue, always visible ─────── */
#c64-frame {
  position: fixed; inset: 0;
  background: #7070DE;             /* C64 colour 14 — light blue   */
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: clamp(14px, 3.2vw, 38px);
  gap: 0;
}

/* ── C64 SCREEN AREA — colour 6 Dark Blue ─────────────────────────  */
#c64-screen-wrapper {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #3535CA;             /* C64 colour 6 — blue          */
}

/* Matrix canvas, centred inside the screen wrapper, oversized for rotation */
#c {
  position: absolute;
  transform-origin: center center;
}

/* CRT scanlines over everything */
#c64-screen-wrapper::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(
    transparent, transparent 3px, rgba(0,0,0,0.13) 3px, rgba(0,0,0,0.13) 4px);
}
/* Vignette inside screen */
#c64-screen-wrapper::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 6;
  background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,0.68) 100%);
}

/* ── C64 BOOT OVERLAY — sits inside the screen wrapper ─────────────  */
#c64-boot {
  position: absolute; inset: 0; z-index: 10;
  background: #3535CA;
  display: flex; align-items: flex-start; justify-content: flex-start;
  padding: clamp(6px, 2vw, 18px);
  font-family: 'Press Start 2P', monospace;
  color: #7070DE;
  transition: opacity 1.3s ease-in;
}
#c64-boot.fade-out { opacity: 0; pointer-events: none; }

#c64-boot-text {
  font-size: clamp(6px, 1.5vw, 12px);
  line-height: 1.8;
  white-space: pre;
  letter-spacing: 0.04em;
}

#c64-cursor {
  display: inline-block; width: 0.9em; height: 1.1em;
  background: #7070DE; vertical-align: bottom; margin-bottom: -0.08em;
  animation: cblink 0.8s step-start infinite;
}
@keyframes cblink { 50% { opacity: 0; } }

/* ── CONTROL STRIP — inside the light-blue screenframe, below screen ─ */
#c64-controls {
  flex-shrink: 0;
  padding: clamp(5px, 1vw, 10px) clamp(8px, 2vw, 18px);
  display: flex;
  align-items: center;
  gap: clamp(10px, 3vw, 28px);
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(6px, 1.2vw, 10px);
  color: rgba(200, 200, 255, 0.88);   /* slightly lighter than frame */
  user-select: none;
}

#c64-controls label {
  display: flex; align-items: center;
  gap: clamp(4px, 0.8vw, 8px);
  cursor: pointer;
  letter-spacing: 0.05em;
}

/* Pixel-art style checkbox */
#c64-controls input[type="checkbox"] {
  appearance: none; -webkit-appearance: none;
  width: clamp(9px, 1.4vw, 14px); height: clamp(9px, 1.4vw, 14px);
  border: 2px solid rgba(180,180,255,0.75);
  background: transparent; cursor: pointer; flex-shrink: 0;
  position: relative;
}
#c64-controls input[type="checkbox"]:checked {
  background: rgba(180,180,255,0.75);
}
#c64-controls input[type="checkbox"]:checked::after {
  content: '';
  position: absolute; inset: 2px;
  background: #3535CA;
  clip-path: polygon(20% 50%, 40% 75%, 80% 20%, 80% 30%, 40% 85%, 20% 60%);
}

#c64-controls .divider {
  color: rgba(160,160,220,0.4); font-size: 0.8em;
}

#gyro-hint {
  position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
  color: rgba(150,150,220,0.6); font: 9px 'Press Start 2P', monospace;
  pointer-events: none; z-index: 99; transition: opacity 1s;
}
</style>
</head>
<body>

<!-- Persistent C64 screenframe — colour 14 light blue border, always on -->
<div id="c64-frame">

  <!-- Dark blue screen area — colour 6 -->
  <div id="c64-screen-wrapper">
    <canvas id="c"></canvas>

    <!-- C64 BASIC boot overlay (inside the screen, not full-page) -->
    <div id="c64-boot">
      <div id="c64-boot-text"><span id="c64-text"></span><span id="c64-cursor"></span></div>
    </div>
  </div>

  <!-- Control strip in the light-blue frame area -->
  <div id="c64-controls">
    <label title="Japanese katakana + kanji">
      <input type="checkbox" id="cb-zh" checked> 日 CJK
    </label>
    <span class="divider">|</span>
    <label title="A-Z symbols">
      <input type="checkbox" id="cb-en" checked> ABC
    </label>
    <span class="divider">|</span>
    <label title="Space Invader sprites">
      <input type="checkbox" id="cb-inv" checked> 👾
    </label>
  </div>

</div>

<div id="gyro-hint" style="display:none">TAP TO ENABLE GYRO</div>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
// CHUNKY MATRIX — C64 boot → PETSCII chaos → Matrix rain
// C64 colours: bg=#3535CA (colour 6), frame=#7070DE (colour 14)
// States: BOOT → TYPING → LOADING → CHAOS → DISSOLVE → MATRIX
// ═══════════════════════════════════════════════════════════════════════

// ── C64 16-colour palette (VICE/Pepto NTSC) ─────────────────────────
const C64_PAL = [
  '#000000','#FFFFFF','#883322','#AAFFEE',
  '#CC44CC','#44BB44','#3535CA','#EEEE77',
  '#DD8833','#664400','#FF7755','#333333',
  '#777777','#AAEEAA','#7070DE','#BBBBBB',
];
const C64_SCREEN = '#3535CA';   // colour 6  — dark blue (screen bg)
const C64_FRAME  = '#7070DE';   // colour 14 — light blue (border/frame)

// ── Matrix colours ───────────────────────────────────────────────────
const C_HEAD = '#ffffff';
const C_TR1  = '#92f792';
const C_TR2  = '#009900';
const C_DIM  = '#1b3a1b';
const C_BG   = '#000000';

// ── Character sets ───────────────────────────────────────────────────
const EN_CHARS = '@ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*=';
// Katakana (the original Matrix film characters) + common kanji
const ZH_CHARS =
  'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン' +
  '日月火水木金土山川田林森石人口大小上下左右中白黒夜雨風空電雲星龍鬼神道';
// PETSCII-style set used during loading chaos
const PETSCII = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+=-|/<>?!:.';

// ── Invader sprites (8×8 bitmaps) ───────────────────────────────────
const SPRITES = [
  [0b00100100,0b00011000,0b00111100,0b01101110,
   0b11111111,0b10111101,0b10000001,0b01100110],  // crab
  [0b00011000,0b00111100,0b01111110,0b11011011,
   0b11111111,0b00100100,0b01011010,0b10100101],  // jellyfish
  [0b00111100,0b01111110,0b11111111,0b11011011,
   0b11111111,0b00100100,0b01011010,0b10100101],  // squid
];
const INV_SENTINELS = ['\x01','\x02','\x03'];

// ── Active character set (rebuilt when checkboxes change) ────────────
let activeChars  = [...EN_CHARS, ...ZH_CHARS];
let invEnabled   = true;
const INVADER_CHANCE = 7;   // 1-in-N when invaders enabled

function rebuildChars() {
  const cbZh  = document.getElementById('cb-zh');
  const cbEn  = document.getElementById('cb-en');
  invEnabled  = document.getElementById('cb-inv').checked;
  let pool = '';
  if (cbZh.checked)  pool += ZH_CHARS;
  if (cbEn.checked)  pool += EN_CHARS;
  if (!pool) pool = EN_CHARS;              // safety fallback
  activeChars = [...pool];
  // Switch canvas font: DotGothic16 when CJK active, Press Start 2P otherwise
  const useCJK = cbZh.checked;
  const snapTo = useCJK ? 16 : 8;
  FONT_PX = Math.max(snapTo, Math.floor(CELL_W * 0.72 / snapTo) * snapTo);
  ctx.font = `${FONT_PX}px '${useCJK ? 'DotGothic16' : 'Press Start 2P'}', monospace`;
}

['cb-zh','cb-en','cb-inv'].forEach(id => {
  document.getElementById(id).addEventListener('change', rebuildChars);
});

// ── State ────────────────────────────────────────────────────────────
let appState = 'BOOT';

// ── Canvas / context ─────────────────────────────────────────────────
const cvs  = document.getElementById('c');
const ctx   = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

let CELL_W, CELL_H, FONT_PX;
let COLS = 0, ROWS = 0;
let columns = [], grid = [], chaosGrid = [], dissolveT = 0;

const FPS = 20;

// ── Gyroscope ────────────────────────────────────────────────────────
let targetAngle = 0, currentAngle = 0;
function attachGyro() {
  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    targetAngle = (Math.max(-75,Math.min(75,e.gamma)) / 75) * (Math.PI * 0.55);
  }, { passive: true });
}
const hint = document.getElementById('gyro-hint');
if (typeof DeviceOrientationEvent !== 'undefined') {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    hint.style.display = 'block';
    document.addEventListener('touchstart', function ask() {
      DeviceOrientationEvent.requestPermission()
        .then(s => { if (s==='granted') attachGyro(); }).catch(()=>{});
      hint.style.opacity = '0';
      setTimeout(() => { hint.style.display = 'none'; }, 1000);
      document.removeEventListener('touchstart', ask);
    }, { once: true });
  } else { attachGyro(); }
}

// ── Sizing: derive from the actual screen wrapper dimensions ─────────
function chunkSize(W) {
  const cols = W < 480 ? 8 : W < 900 ? 13 : 24;
  const w = Math.round(W / cols);
  const h = Math.round(w * 1.28);
  const useCJK = document.getElementById('cb-zh').checked;
  const snap   = useCJK ? 16 : 8;
  const f = Math.max(snap, Math.floor(w * 0.72 / snap) * snap);
  return { w, h, f };
}

function makeColumn(x) {
  const sp = (Math.random() * 4 | 0) + 1;
  return { x, row: Math.random()*ROWS|0, speed: sp, delay: sp,
           len: (Math.random()*16|0) + 6 };
}

function resize() {
  const wrapper = document.getElementById('c64-screen-wrapper');
  const r = wrapper.getBoundingClientRect();
  const W = r.width, H = r.height;
  ({ w: CELL_W, h: CELL_H, f: FONT_PX } = chunkSize(W));
  const D = Math.ceil(Math.sqrt(W*W + H*H)) + CELL_W * 2;
  cvs.width = D; cvs.height = D;
  cvs.style.width  = D + 'px'; cvs.style.height = D + 'px';
  cvs.style.left   = ((W - D) / 2) + 'px';
  cvs.style.top    = ((H - D) / 2) + 'px';
  COLS = Math.ceil(D / CELL_W);
  ROWS = Math.ceil(D / CELL_H);
  // Font: DotGothic16 when CJK active, else Press Start 2P
  const useCJK = document.getElementById('cb-zh').checked;
  ctx.font = `${FONT_PX}px '${useCJK ? 'DotGothic16' : 'Press Start 2P'}', monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = appState === 'MATRIX' ? C_BG : C64_SCREEN;
  ctx.fillRect(0, 0, D, D);
  grid      = Array.from({ length: COLS }, () => new Array(ROWS).fill(' '));
  chaosGrid = Array.from({ length: COLS }, () =>
    Array.from({ length: ROWS }, () => ({ ch: ' ', col: C64_SCREEN })));
  columns = Array.from({ length: COLS }, (_, i) => makeColumn(i));
}
window.addEventListener('resize', () => { resize(); }, { passive: true });

// ── Draw helpers ──────────────────────────────────────────────────────
function drawSprite(px, py, type, color, glow) {
  const bm = SPRITES[type];
  const pw = Math.max(1, Math.floor(CELL_W / 10));
  const ox = px + Math.round((CELL_W - pw*8) / 2);
  const oy = py + Math.round((CELL_H - pw*8) / 2);
  if (glow) { ctx.shadowColor = '#00ff41'; ctx.shadowBlur = pw*4; }
  ctx.fillStyle = color;
  for (let r=0;r<8;r++)
    for (let b=7;b>=0;b--)
      if (bm[r]&(1<<b)) ctx.fillRect(ox+(7-b)*pw, oy+r*pw, pw, pw);
  if (glow) ctx.shadowBlur = 0;
}

function drawCell(c, r, ch, color, glow, bg) {
  if (c<0||c>=COLS||r<0||r>=ROWS) return;
  const px=c*CELL_W, py=r*CELL_H;
  ctx.shadowBlur=0;
  ctx.fillStyle = bg || C_BG;
  ctx.fillRect(px,py,CELL_W,CELL_H);
  if (ch!==' ') {
    const inv = INV_SENTINELS.indexOf(ch);
    if (inv>=0) { drawSprite(px,py,inv,color,glow); }
    else {
      if (glow) { ctx.shadowColor='#00ff41'; ctx.shadowBlur=CELL_W*0.4; }
      ctx.fillStyle=color;
      ctx.fillText(ch, px+CELL_W/2, py+CELL_H/2);
      if (glow) ctx.shadowBlur=0;
    }
  }
  grid[c][r]=ch;
}

function recolour(c, r, color) {
  if (c<0||c>=COLS||r<0||r>=ROWS) return;
  const ch=grid[c][r]; if (ch===' ') return;
  const px=c*CELL_W, py=r*CELL_H;
  ctx.fillStyle=C_BG; ctx.fillRect(px,py,CELL_W,CELL_H);
  const inv=INV_SENTINELS.indexOf(ch);
  if (inv>=0) { drawSprite(px,py,inv,color,false); }
  else { ctx.fillStyle=color; ctx.fillText(ch,px+CELL_W/2,py+CELL_H/2); }
}

// ── CHAOS: PETSCII data streams into video RAM ────────────────────────
let chaosScanRow = 0;
const CHAOS_ROWS_PER_FRAME = 3;

function updateChaos() {
  for (let pass=0; pass<CHAOS_ROWS_PER_FRAME; pass++) {
    if (chaosScanRow >= ROWS) {
      if (appState==='CHAOS') {
        appState='DISSOLVE'; dissolveT=0;
        // Switch to black bg under chaos; redraw chaos glyphs on it
        ctx.fillStyle=C_BG; ctx.fillRect(0,0,cvs.width,cvs.height);
        for (let x=0;x<COLS;x++) for (let y=0;y<ROWS;y++) {
          const cell=chaosGrid[x][y];
          if (cell.ch!==' ') {
            ctx.fillStyle=cell.col;
            ctx.fillText(cell.ch, x*CELL_W+CELL_W/2, y*CELL_H+CELL_H/2);
            grid[x][y]=cell.ch;
          }
        }
        columns=Array.from({length:COLS},(_,i)=>makeColumn(i));
      }
      return;
    }
    for (let x=0;x<COLS;x++) {
      const ch  = PETSCII[Math.random()*PETSCII.length|0];
      const col = C64_PAL[Math.random()*C64_PAL.length|0];
      chaosGrid[x][chaosScanRow]={ch,col};
      drawCell(x,chaosScanRow,ch,col,false,C64_SCREEN);
    }
    chaosScanRow++;
  }
}

// ── MATRIX update ────────────────────────────────────────────────────
function updateMatrix() {
  for (let x=0;x<COLS;x++) {
    const col=columns[x];
    if (--col.delay>0) continue;
    col.delay=col.speed; col.row++;
    if (col.row-col.len>=ROWS) {
      col.row=0; col.speed=(Math.random()*4|0)+1;
      col.delay=col.speed; col.len=(Math.random()*16|0)+6;
    }
    const r=col.row;
    drawCell(x,r-col.len,' ',C_BG);
    recolour(x,r-col.len+1,C_DIM);
    recolour(x,r-2,C_TR2); recolour(x,r-1,C_TR1);
    let hd;
    if (invEnabled && (Math.random()*INVADER_CHANCE|0)===0)
      hd=INV_SENTINELS[Math.random()*SPRITES.length|0];
    else
      hd=activeChars[Math.random()*activeChars.length|0];
    drawCell(x,r,hd,C_HEAD,true);
  }
}

function update() {
  switch (appState) {
    case 'CHAOS':    updateChaos(); break;
    case 'DISSOLVE': dissolveT++; updateMatrix();
                     if (dissolveT>ROWS*3) appState='MATRIX'; break;
    case 'MATRIX':   updateMatrix(); break;
  }
}

// ── Render loop ───────────────────────────────────────────────────────
const STEP_MS = 1000 / FPS;
let lastT = 0;

function frame(t) {
  requestAnimationFrame(frame);
  const diff = targetAngle - currentAngle;
  if (Math.abs(diff)>0.0003) {
    currentAngle += diff * 0.07;
    cvs.style.transform = `rotate(${currentAngle.toFixed(4)}rad)`;
  }
  if (t-lastT < STEP_MS) return;
  lastT = t - ((t-lastT) % STEP_MS);
  update();
}

// ── C64 Boot Sequence ─────────────────────────────────────────────────
const c64text   = document.getElementById('c64-text');
const c64boot   = document.getElementById('c64-boot');

function typeText(str, ms) {
  return new Promise(resolve => {
    let i=0;
    (function next() {
      if (i>=str.length) { resolve(); return; }
      c64text.textContent += str[i++];
      setTimeout(next, ms + Math.random()*ms*0.35);
    })();
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const addLine = s => { c64text.textContent += s + '\n'; };

async function runC64Boot() {
  addLine('');
  addLine('    **** COMMODORE 64 BASIC V2 ****');
  addLine('');
  addLine(' 64K RAM SYSTEM  38911 BASIC BYTES FREE');
  addLine('');
  addLine('READY.');
  await wait(900);

  appState = 'TYPING';
  await typeText('LOAD "CHUNKY_MATRIX",8,1', 55);
  c64text.textContent += '\n\n';
  await wait(350);

  appState = 'LOADING';
  addLine('SEARCHING FOR CHUNKY_MATRIX.');
  await wait(650);
  c64text.textContent += 'LOADING';
  for (let i=0;i<6;i++) { await wait(280); c64text.textContent += '.'; }
  c64text.textContent += '\n\n';
  await wait(450);

  addLine('READY.');
  await wait(380);
  c64text.textContent += 'RUN\n';
  await wait(550);

  // Trigger canvas PETSCII chaos
  appState = 'CHAOS';
  chaosScanRow = 0;
  ctx.fillStyle = C64_SCREEN;
  ctx.fillRect(0, 0, cvs.width, cvs.height);

  // Fade out the boot overlay (canvas chaos shows through behind it)
  await wait(250);
  c64boot.classList.add('fade-out');
  await wait(1500);
  c64boot.style.display = 'none';
}

// ── Start ─────────────────────────────────────────────────────────────
document.fonts.ready.then(() => {
  resize();
  rebuildChars();
  // Pre-fill canvas with C64 blue during boot
  ctx.fillStyle = C64_SCREEN;
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  requestAnimationFrame(frame);
  runC64Boot();
});
</script>
</body>
</html>
